name: arca
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  arca_core:
    path: ../packages/arca_core
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/arca.png

# media_kit_video with a fix for Linux: it looked for Flutter's EGL context
# on the platform thread, found none with current Flutter, and fell back to
# rendering every frame on the CPU (third_party/media_kit_video/ARCA.md).
dependency_overrides:
  media_kit_video:
    path: ../third_party/media_kit_video
